server {
    listen 80;
    server_name _;

    root  /var/www/html/public;
    index index.php;

    # Asset statici: serviti direttamente da Nginx con cache aggressiva
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires max;
        add_header Cache-Control "public, immutable";
        log_not_found off;
    }

    # Tutte le altre richieste → Laravel (front controller)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Passa le richieste PHP a PHP-FPM (servizio "app" sulla porta 9000)
    location ~ \.php$ {
        fastcgi_pass        app:9000;
        fastcgi_index       index.php;
        fastcgi_param       SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include             fastcgi_params;
        fastcgi_buffer_size 128k;
        fastcgi_buffers     4 256k;
        fastcgi_read_timeout 60;
    }

    # Blocca l'accesso ai file nascosti (.env, .git, ecc.)
    location ~ /\. {
        deny all;
    }
}
