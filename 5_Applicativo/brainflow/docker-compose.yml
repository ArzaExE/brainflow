name: brainflow

services:

  app:
    build: .
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: brainflow
      DB_USERNAME: brainflow
      DB_PASSWORD: secret
    volumes:
      - app_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  webserver:
    image: nginx:alpine
    ports:
      - "7777:80"
    volumes:
      - app_data:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: brainflow
      MYSQL_USER: brainflow
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "brainflow", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  app_data:
  db_data:
